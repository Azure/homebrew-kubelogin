name: Update kubelogin version

on:
  schedule:
    # Run daily at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'kubelogin version (without v prefix, e.g., 0.2.14). Leave empty to check for latest.'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: update-kubelogin
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Use manually provided version
            VERSION="${{ github.event.inputs.version }}"
          else
            # Get latest release from Azure/kubelogin
            VERSION=$(gh release view --repo Azure/kubelogin --json tagName -q '.tagName')
          fi
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          # Validate version format (semantic versioning: X.Y.Z)
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format '${VERSION}'. Expected semantic version (e.g., 0.2.14)"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Latest kubelogin version: ${VERSION}"

      - name: Check current version in formula
        id: check
        run: |
          CURRENT_VERSION=$(grep -m1 'version "' Formula/kubelogin.rb | sed 's/.*version "\([^"]*\)".*/\1/')
          LATEST_VERSION="${{ steps.version.outputs.version }}"
          echo "Current version: ${CURRENT_VERSION}"
          echo "Latest version:  ${LATEST_VERSION}"
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

          if [ "${CURRENT_VERSION}" = "${LATEST_VERSION}" ]; then
            echo "Already up to date!"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          elif [ "$(printf '%s\n%s\n' "${CURRENT_VERSION}" "${LATEST_VERSION}" | sort -V | tail -n1)" != "${LATEST_VERSION}" ]; then
            echo "::error::Requested version v${LATEST_VERSION} is older than current version v${CURRENT_VERSION}."
            exit 1
          else
            echo "Update needed: ${CURRENT_VERSION} -> ${LATEST_VERSION}"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Download and verify archives
        if: steps.check.outputs.needs_update == 'true'
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Define archives to download
          ARCHIVES=(
            "kubelogin-darwin-amd64.zip"
            "kubelogin-darwin-arm64.zip"
            "kubelogin-linux-amd64.zip"
          )

          DOWNLOAD_DIR="${RUNNER_TEMP}/kubelogin-v${VERSION}"
          rm -rf "${DOWNLOAD_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          cd "${DOWNLOAD_DIR}"

          # Download all archives and their sha256 files using gh cli
          for archive in "${ARCHIVES[@]}"; do
            echo "Downloading ${archive} and ${archive}.sha256..."
            gh release download "v${VERSION}" \
              --repo Azure/kubelogin \
              --pattern "${archive}" \
              --pattern "${archive}.sha256"
          done

          # Verify SHA256 for each archive
          for archive in "${ARCHIVES[@]}"; do
            echo "Verifying ${archive}..."

            # Extract expected SHA256 (file format: "sha256  filename")
            EXPECTED_SHA256=$(awk '{print $1}' "${archive}.sha256")

            # Calculate actual SHA256
            ACTUAL_SHA256=$(sha256sum "${archive}" | awk '{print $1}')

            echo "Expected SHA256: ${EXPECTED_SHA256}"
            echo "Actual SHA256:   ${ACTUAL_SHA256}"

            # Verify SHA256
            if [ "${EXPECTED_SHA256}" != "${ACTUAL_SHA256}" ]; then
              echo "::error::SHA256 mismatch for ${archive}!"
              exit 1
            fi

            echo "SHA256 verified for ${archive}"
          done

          # Output SHA256 values for the tracking issue
          echo "sha256_darwin_amd64=$(awk '{print $1}' kubelogin-darwin-amd64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_darwin_arm64=$(awk '{print $1}' kubelogin-darwin-arm64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_linux_amd64=$(awk '{print $1}' kubelogin-linux-amd64.zip.sha256)" >> $GITHUB_OUTPUT

          echo "All archives downloaded and verified successfully!"

      - name: Reconcile update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          LATEST_VERSION: ${{ steps.version.outputs.version }}
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          SHA256_DARWIN_AMD64: ${{ steps.download.outputs.sha256_darwin_amd64 }}
          SHA256_DARWIN_ARM64: ${{ steps.download.outputs.sha256_darwin_arm64 }}
          SHA256_LINUX_AMD64: ${{ steps.download.outputs.sha256_linux_amd64 }}
        run: |
          set -euo pipefail

          TRACKING_LABEL="kubelogin-update"
          if ! gh label list \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 100 \
            --json name \
            --jq '.[].name' | grep -Fxq "${TRACKING_LABEL}"; then
            gh label create "${TRACKING_LABEL}" \
              --repo "${GITHUB_REPOSITORY}" \
              --color "0366d6" \
              --description "Managed by the update-kubelogin workflow"
          fi

          mapfile -t TRACKED_ISSUES < <(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state all \
              --label "${TRACKING_LABEL}" \
              --limit 100 \
              --json number,state,title,body \
              --jq '.[] | select((.body // "") | contains("<!-- kubelogin-update-tracker -->")) | "\(.number)\t\(.state)\t\(.title)"'
          )

          if [ "${NEEDS_UPDATE}" != "true" ]; then
            for issue in "${TRACKED_ISSUES[@]}"; do
              IFS=$'\t' read -r issue_number issue_state issue_title <<< "${issue}"
              if [ "${issue_state}" = "OPEN" ]; then
                gh issue comment "${issue_number}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --body "Closing because the Homebrew formulas now use kubelogin v${CURRENT_VERSION}."
                gh issue close "${issue_number}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --reason completed
              fi
            done

            echo "The Homebrew formulas already use kubelogin v${CURRENT_VERSION}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          ISSUE_TITLE="Update kubelogin to v${LATEST_VERSION}"
          ISSUE_BODY="${RUNNER_TEMP}/kubelogin-update-issue.md"
          cat > "${ISSUE_BODY}" <<EOF
          <!-- kubelogin-update-tracker -->
          ## kubelogin update available

          The Homebrew formulas currently use kubelogin v${CURRENT_VERSION}. Version v${LATEST_VERSION} is available.

          ## Release

          https://github.com/Azure/kubelogin/releases/tag/v${LATEST_VERSION}

          ## Verified SHA256 checksums

          | Archive | SHA256 |
          |---|---|
          | \`kubelogin-darwin-amd64.zip\` | \`${SHA256_DARWIN_AMD64}\` |
          | \`kubelogin-darwin-arm64.zip\` | \`${SHA256_DARWIN_ARM64}\` |
          | \`kubelogin-linux-amd64.zip\` | \`${SHA256_LINUX_AMD64}\` |

          Update both \`Formula/kubelogin.rb\` and \`Formula/az-kubelogin.rb\`.

          ---
          *This issue is managed by the update-kubelogin workflow.*
          EOF

          exact_issue_number=""
          exact_issue_state=""

          for issue in "${TRACKED_ISSUES[@]}"; do
            IFS=$'\t' read -r issue_number issue_state issue_title <<< "${issue}"

            if [ "${issue_title}" = "${ISSUE_TITLE}" ]; then
              if [ -z "${exact_issue_number}" ]; then
                exact_issue_number="${issue_number}"
                exact_issue_state="${issue_state}"
              elif [ "${issue_state}" = "OPEN" ] && [ "${exact_issue_state}" = "OPEN" ]; then
                gh issue comment "${issue_number}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --body "Closing as a duplicate of #${exact_issue_number}."
                gh issue close "${issue_number}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --reason not_planned
              elif [ "${issue_state}" = "OPEN" ]; then
                exact_issue_number="${issue_number}"
                exact_issue_state="${issue_state}"
              fi
            elif [ "${issue_state}" = "OPEN" ]; then
              gh issue comment "${issue_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "Superseded by kubelogin v${LATEST_VERSION}."
              gh issue close "${issue_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --reason completed
            fi
          done

          if [ -n "${exact_issue_number}" ]; then
            if [ "${exact_issue_state}" = "OPEN" ]; then
              EXISTING_BODY="${RUNNER_TEMP}/existing-kubelogin-update-issue.md"
              gh issue view "${exact_issue_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json body \
                --jq '.body' > "${EXISTING_BODY}"

              if ! cmp -s "${ISSUE_BODY}" "${EXISTING_BODY}"; then
                gh issue edit "${exact_issue_number}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --body-file "${ISSUE_BODY}"
              fi

              echo "Updated issue #${exact_issue_number} for kubelogin v${LATEST_VERSION}." >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "kubelogin v${LATEST_VERSION} was already tracked by closed issue #${exact_issue_number}; no duplicate issue was created." >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            issue_url=$(gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${ISSUE_TITLE}" \
              --body-file "${ISSUE_BODY}" \
              --label dependencies \
              --label "${TRACKING_LABEL}")
            echo "Created ${issue_url}." >> "${GITHUB_STEP_SUMMARY}"
          fi
